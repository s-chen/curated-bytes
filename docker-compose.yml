# Local testing only. Production runs on the GitHub Actions hourly cron.
#   docker compose run --rm scraper   # fetch feeds -> web-dashboard/public/news.json
#                                     # (top stories too if GEMINI_API_KEY is exported)
#   docker compose run --rm tests     # run the scraper test suite
#   docker compose up dashboard       # dashboard dev server on http://localhost:5173
#   docker compose run --rm dashboard npm test   # dashboard tests (also: lint, build)
#
# On Linux, run as your own user so the output file is writable and owned by you:
#   export HOST_UID=$(id -u) HOST_GID=$(id -g)
# (Not needed with Docker Desktop on macOS, which maps file ownership itself.)

services:
  scraper:
    build:
      context: ./scraper
      target: runtime
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      # Passed through from your shell when set; never put the key in this file.
      - GEMINI_API_KEY
      - GEMINI_MODEL
    volumes:
      # Edit code and sources without rebuilding.
      - ./scraper/src:/app/src:ro
      - ./scraper/config:/app/config:ro
      - ./web-dashboard/public:/data

  tests:
    build:
      context: ./scraper
      target: test
    volumes:
      - ./scraper/src:/app/src:ro
      - ./scraper/tests:/app/tests:ro
      - ./scraper/config:/app/config:ro

  dashboard:
    build: ./web-dashboard
    ports:
      - "5173:5173"
    volumes:
      # Live reload on code edits and on each new scraper run.
      - ./web-dashboard/src:/app/src:ro
      - ./web-dashboard/public:/app/public:ro
      - ./web-dashboard/index.html:/app/index.html:ro
